[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "us3d-latency-benchmark"
version = "0.1.0"
description = "Latency and missing-pose evaluation with user-provided ultrasound acquisition and reconstruction adapters"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
include = ["us3d_latency*"]
